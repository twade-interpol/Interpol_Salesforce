<template>


        <lightning-card   title="Agency" icon-name="standard:account">
    
            <div class="agency-container">
    
 
        <lightning-accordion allow-multiple-sections-open
                             onsectiontoggle={handleSectionToggle}
                             active-section-name={activeSections} >   
            <lightning-accordion-section name="A" label="Agency">


        <lightning-record-edit-form record-id={recordId} object-api-name={objectApiName} onsuccess={handleSuccess}>
            <lightning-messages></lightning-messages>

        
            

            <template for:each={fieldList} for:item="field">
            
                <div key={field} class="slds-grid slds-size_11-of-12 label-inline" if:false={showEditField}>
                      <div class="slds-form-element slds-form-element_horizontal" style=" padding-bottom: 2.25%">
                        
                        <lightning-output-field field-name={field}>
                        </lightning-output-field>
                           <hr style="margin-block:0rem">

                    </div>
                   
                    <div class="slds-col slds-size_1-of-12">
                        <lightning-button-icon variant="bare" icon-name="utility:edit" onclick={handleEdit}>
                        </lightning-button-icon>
                    </div>
                 
                    </div>


                <div key={field} class="slds-grid" if:true={showEditField}>
                    <div class="slds-col slds-size_1-of-1">
                        <lightning-input-field field-name={field}>
                        </lightning-input-field>
                    </div>
                    <hr style="width:50%">
                </div>

             
   
                    
            </template>


            <lightning-button type="submit" name="submit" label="Save" if:true={showbuttons}>
                
            </lightning-button>
              <lightning-button type="Cancel" name="Cancel" label="Cancel" if:true={showbuttons} onclick={handlecancel}>>
                
            </lightning-button>
            
        </lightning-record-edit-form>
    </lightning-accordion-section>
    

</lightning-accordion>
    </div>
</lightning-card>
    </template>
