<template>
<template if:true={isPopupOpen}>
    <section class="slds-modal slds-fade-in-open">
      <div class="slds-modal__container">
        <header class="slds-modal__header">
          <lightning-button-icon
            icon-name="utility:close"
            alternative-text="Close"
            class="slds-modal__close"
            onclick={closePopup}
          ></lightning-button-icon>
          <h2 class="slds-text-heading_medium">Warning Message</h2>
        </header>
        <div class="slds-modal__content slds-p-around_medium"> 
          <p style="font-size: 1rem;"><b>This activity will link the subject to the {objectName}</b><br><b>Please click continue to proceed</b></p>
        </div>
        <footer class="slds-modal__footer">
          <lightning-button label="Continue" onclick={closePopup}></lightning-button>
        </footer>
      </div>
    </section>
    <div class="slds-backdrop slds-backdrop_open"></div>
  </template>

<template if:false={isPopupOpen}>
  <lightning-card title="Link Subject " icon-name="standard:contact">
        <div class="slds-m-around_medium">
            <div>
            <lightning-input
                placeholder="Search Subject"
                value={searchTerm}
                onchange={handleSearch}>
            </lightning-input>
            </div>
           <!-- Lightning datatable to display the fetched and filtered data -->
        <div class="slds-m-top_medium"> 
        <lightning-datatable

            key-field="id"

            data={filteredData}

            columns={columns}
            onrowselection={handleRowSelection}>

        </lightning-datatable>
        </div>
         <div class="slds-m-top_medium slds-align_absolute-center">
            <!-- Save button -->
            <lightning-button
                label="Save"
                variant="brand"
                onclick={handleSave}>
            </lightning-button>
            <div class="slds-m-left_small">
              <lightning-button
                label="Cancel"
                variant="brand"
                onclick={handleCancel}>
            </lightning-button>
            </div>
        </div>
        </div>

    </lightning-card>
</template>
</template>
