<template>

    <div style="border: 1px solid #D8D8D8; border-radius: 5px;">
        <article class="slds-card">
                <div class="slds-page-header slds-page-header_joined ">
            <div class="slds-card__header slds-grid ">
                <header class="slds-media slds-media_center slds-has-flexi-truncate">
                    <div class="slds-media__body">
                        <h2 class="slds-card__header-title">
                            <div class="slds-card__header slds-truncate " >
                                <div class="slds-m-left_small slds-m-top_medium">
                                    <lightning-icon icon-name="standard:contact" size="small"  ></lightning-icon>
                                    <span class="slds-m-left_small" style="font-weight: bold">{strTitle} ({reccount})</span>
                                </div>
                            </div>
                        </h2>
                    </div>
                    <!-- "New" button -->
                    <div class="slds-text-align_right slds-m-top_x-small slds-p-around_medium lgc-bg ">
                               <template if:true={viewallpage}>
                     <lightning-button-icon icon-name="utility:refresh" 
                       variant="border-filled"
                       alternative-text="Refresh"
                       onclick={refreshdata}
                        title="Refresh" 
                        class="slds-m-right_x-small">
                        </lightning-button-icon>
                          &nbsp;
                          &NonBreakingSpace;
                     <template if:true={buttonlabelinq}>
                        <lightning-button
                            label="Link Case to INTERPOL Inquiry"
                            title="Link Case to INTERPOL Inquiry"
                            onclick={handleNavigate}
                            class="slds-m-right_x-small">
                        </lightning-button>
                     </template>
                     <template if:true={buttonlabelinc}>
                        <lightning-button
                            label="Link Inquiry to INTERPOL Case"
                            title="Link Inquiry to INTERPOL Case"
                            onclick={handleNavigate}
                            class="slds-m-right_x-small">
                        </lightning-button>
                     </template>

                        </template>
                    
                    </div>
                </header>
            </div>
            </div>

            <div class=" slds-scrollable slds-border_top" >
                <!-- Inquiry list -->
    <lightning-datatable
            key-field="id"
            columns={columns}
            data={allRecords}
            onrowaction={handleRowAction}
            hide-checkbox-column>
    </lightning-datatable>
            </div>
  <footer class="slds-card__footer">
          <template if:true={showviewall}>
    <a class="slds-card__footer-action" href="#" onclick={viewall}>View All
      <span class="slds-assistive-text">View All</span>
      
    </a>
    </template>
  </footer>
        </article>
    </div>


    <!-- New Contact Dialog -->
       <template if:true={isDelete}>
        <div style="border: 1px solid #D8D8D8; border-radius: 5px;">
        <section role="dialog" tabindex="-1" aria-labelledby="modal-heading-01" aria-modal="true" aria-describedby="modal-content-id-1" class="slds-modal slds-fade-in-open">
            <div class="slds-modal__container">
                
              <article class="slds-card">
                <!-- Header-->
                <header class="slds-modal__header">
                    <button class="slds-button slds-button_icon slds-modal__close slds-button_icon-inverse" title="Close" onclick={closedelete}>
                        <lightning-icon
                            icon-name="utility:close"
                            alternative-text="close"
                            variant="inverse"
                            size="small" >
                        </lightning-icon>
                        <span class="slds-assistive-text">Close</span>
                    </button>
                    <h2 class="slds-text-heading_medium slds-hyphenate">Delete Link for Inquiry to INTERPOL Case  </h2>
                </header>
                <!-- input part-->
                <div class="slds-modal__content slds-p-around_medium">
               <p>Are you Sure ? </p>

                </div>
               <footer class="slds-card__footer">
    <div class="slds-card__footer-action" >

       <lightning-button
                            label="Delete"
                            title="Delete"
                            onclick={deleteRecord}>
                        </lightning-button>
                  

            </div>
  </footer>
              </article>
            </div>
        </section>
        </div>
        </template>


<template if:true={isEdit}>

     <section role="dialog" tabindex="-1" aria-labelledby="modal-heading-01" aria-modal="true" aria-describedby="modal-content-id-1" class="slds-modal slds-fade-in-open">
            <div class="slds-modal__container">
                <!-- Header-->
        

                <header class="slds-modal__header">
                    <button class="slds-button slds-button_icon slds-modal__close slds-button_icon-inverse" title="Close" onclick={closeedit}>
                        <lightning-icon
                            icon-name="utility:close"
                            alternative-text="close"
                            variant="inverse"
                            size="small" >
                        </lightning-icon>
                        <span class="slds-assistive-text">Close</span>
                    </button>
                    <h2 class="slds-text-heading_medium slds-hyphenate">Edit Link</h2>
                </header>
                <!-- input part-->
                <div class="slds-modal__content slds-p-around_medium">
           <lightning-record-edit-form
                record-id={rowtoEdit.Id}
                object-api-name={objectApiName}
                onsuccess={handleSuccess}
                onerror={handleError}
                onsubmit={handleSubmit}
            >
                <template for:each={fields} for:item="field">
                    <lightning-input-field field-name={field} key={field}></lightning-input-field>
                </template>
                <div class="slds-m-top_medium">
                    <lightning-button variant="brand" type="submit" label="Save"></lightning-button>
                </div>
            </lightning-record-edit-form>


                </div>
            </div>
        </section>
        <div class="slds-backdrop slds-backdrop_open"></div>




</template>



    
    <template if:true={isShowModal}>
        
        <section role="dialog" tabindex="-1" aria-labelledby="modal-heading-01" aria-modal="true" aria-describedby="modal-content-id-1" class="slds-modal slds-fade-in-open">
            <div class="slds-modal__container">
                <!-- Header-->
        

                <header class="slds-modal__header">
                    <button class="slds-button slds-button_icon slds-modal__close slds-button_icon-inverse" title="Close" onclick={closeModal}>
                        <lightning-icon
                            icon-name="utility:close"
                            alternative-text="close"
                            variant="inverse"
                            size="small" >
                        </lightning-icon>
                        <span class="slds-assistive-text">Close</span>
                    </button>
                    <h2 class="slds-text-heading_medium slds-hyphenate">New Contact</h2>
                </header>
                <!-- input part-->
                <div class="slds-modal__content slds-p-around_medium">
                    <lightning-record-form
                        object-api-name="Contact"
                        fields={createFields}
                        onsuccess={onSuccess}
                        columns="2"
                        oncancel={closeModal}
                        onsubmit={onSubmit}>
                    </lightning-record-form>
                </div>
            </div>
        </section>
        <div class="slds-backdrop slds-backdrop_open"></div>
    </template>
</template>
